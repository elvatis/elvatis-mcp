# AAHP Verify - the intended REQUIRED status check for the handoff gate.
#
# Runs `aahp verify --level ci`, which executes all 4 layers with NO escape
# hatch (AAHP_SKIP_VERIFY is ignored at --level ci). This is the off-machine,
# non-bypassable backstop behind the local pre-commit / pre-push hooks:
#   Layer 1: MANIFEST checksum integrity
#   Layer 2: content-drift gate (code changed => STATUS.md + MANIFEST.json must change)
#   Layer 3: commit-pointer freshness
#   Layer 4: TRUST-TTL expiry (advisory)
#
# The gate is driven by the pinned @elvatis_com/aahp CLI (devDependencies), not a
# vendored copy of the scripts, so it stays in lockstep with the published protocol.
#
# Dependabot exemption: a pure dependency bump introduces no handoff-state change,
# so the AAHP handoff gate does not apply to it. The job no-ops to success when the
# change originates from dependabot[bot] - on both the PR (github.actor) and the
# resulting push to main (head_commit.author). Build stays gated by the CI workflow
# and the supply chain by the Scan check, both of which still run on those PRs.
# `tests/security/action-pin.test.ts` asserts this exemption still exists: without
# it every scanner bump is blocked by a gate a bot cannot satisfy, and the SHA pin
# in supply-chain-guard.yml ages exactly as if Dependabot had been switched off.
#
# TWO CLAIMS WERE REMOVED FROM THIS HEADER ON 2026-08-21 BECAUSE THEY WERE FALSE,
# and both were the reassuring kind - the kind a reader accepts and stops checking:
#
#   - "CodeQL checks, which still run". There is no CodeQL workflow in this
#     repository and default setup is off: `gh api repos/elvatis/elvatis-mcp/
#     code-scanning/default-setup` returns `"state": "not-configured"` and
#     `/code-scanning/analyses` returns "no analysis found". The sentence named a
#     second gate covering dependabot PRs; that gate does not exist.
#   - "GitHub Actions is currently OFF org-wide (cost sweep) ... activates
#     automatically when Actions is re-enabled." Actions is ON and has been for
#     some time: CI, Scan and this workflow all completed successfully on
#     2026-08-19. The note made a live workflow read as dormant.
#
# THE FOLLOW-UP THAT NOTE CARRIED IS STILL OPEN, and is why the first line says
# "intended": measured 2026-08-21, `main` has branch protection but
# `required_status_checks` is `null`. No check on this repository is required,
# so this gate - and CI, and Scan - are advisory. That is a repository setting,
# unreachable from any file here; recorded in .ai/handoff/STATUS.md and open
# with the maintainer, together with the same question about who merges a
# scanner bump. SECURITY.md records the same class of gap on the release path.

name: AAHP Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  aahp-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Dependabot exemption (handoff gate not applicable)
        if: ${{ github.actor == 'dependabot[bot]' || github.event.head_commit.author.username == 'dependabot[bot]' }}
        run: |
          echo "Dependabot change detected: the AAHP handoff gate does not apply."
          echo "A pure dependency bump introduces no handoff-state change."
          echo "Security and build remain gated by the supply-chain-guard and CodeQL checks."

      - name: Checkout code
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        uses: actions/checkout@v7
        with:
          # Full history so the content-drift gate can diff against the base.
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies (pinned AAHP CLI)
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        run: npm ci --ignore-scripts

      - name: Run aahp verify (CI level, no escape hatch)
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        run: npx --no-install aahp verify . --level ci

      - name: Emit conformance record
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        run: npx --no-install aahp doctor . --json
