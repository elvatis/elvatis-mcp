# AAHP Verify - the intended REQUIRED status check for the handoff gate.
#
# Runs `aahp verify --level ci`, which executes all 4 layers with NO escape
# hatch (AAHP_SKIP_VERIFY is ignored at --level ci). This is the off-machine,
# non-bypassable backstop behind the local pre-commit / pre-push hooks:
#   Layer 1: MANIFEST checksum integrity
#   Layer 2: content-drift gate (code changed => STATUS.md + MANIFEST.json must change)
#   Layer 3: commit-pointer freshness
#   Layer 4: TRUST-TTL expiry (advisory)
#
# The gate is driven by the pinned @elvatis_com/aahp CLI (devDependencies), not a
# vendored copy of the scripts, so it stays in lockstep with the published protocol.
#
# LAYER 2 IS FAIL-CLOSED FROM AAHP 3.10.0, and that is what changed this file.
# The drift gate now REFUSES to run without an explicit `--base SHA` /
# `AAHP_BASE_SHA` instead of diffing against an implicit base, and it separately
# refuses a base that resolves to HEAD, "which would make Layer 2 vacuous". So
# every trigger below has to name its own base:
#   pull_request      -> github.event.pull_request.base.sha
#   push              -> github.event.before
#   workflow_dispatch -> the REQUIRED `base` input declared under `on:`
# A manual run has no event base to fall back on; without that input every
# dispatch fails closed and reads as a broken workflow rather than as a missing
# argument. `scripts/require-layer2-base.mjs` rejects an absent, empty, all-zero
# or non-SHA base with exit 2 BEFORE `aahp verify` is reached, and
# `tests/security/aahp-gate.test.ts` executes that script in both directions and
# enumerates the triggers here against the base expression.
#
# Dependabot exemption: a pure dependency bump introduces no handoff-state change,
# so the AAHP handoff gate does not apply to it. The job no-ops to success when the
# change originates from dependabot[bot] - on both the PR (github.actor) and the
# resulting push to main (head_commit.author). Build stays gated by the CI workflow
# and the supply chain by the Scan check, both of which still run on those PRs.
# `tests/security/action-pin.test.ts` asserts this exemption still exists: without
# it every scanner bump is blocked by a gate a bot cannot satisfy, and the SHA pin
# in supply-chain-guard.yml ages exactly as if Dependabot had been switched off.
#
# TWO CLAIMS WERE REMOVED FROM THIS HEADER ON 2026-08-21 BECAUSE THEY WERE FALSE,
# and both were the reassuring kind - the kind a reader accepts and stops checking:
#
#   - "CodeQL checks, which still run". There is no CodeQL workflow in this
#     repository and default setup is off: `gh api repos/elvatis/elvatis-mcp/
#     code-scanning/default-setup` returns `"state": "not-configured"` and
#     `/code-scanning/analyses` returns "no analysis found". The sentence named a
#     second gate covering dependabot PRs; that gate does not exist.
#   - "GitHub Actions is currently OFF org-wide (cost sweep) ... activates
#     automatically when Actions is re-enabled." Actions is ON and has been for
#     some time: CI, Scan and this workflow all completed successfully on
#     2026-08-19. The note made a live workflow read as dormant.
#
# THE FOLLOW-UP THAT NOTE CARRIED IS STILL OPEN, and is why the first line says
# "intended": measured 2026-08-21, `main` has branch protection but
# `required_status_checks` is `null`. No check on this repository is required,
# so this gate - and CI, and Scan - are advisory. That is a repository setting,
# unreachable from any file here; recorded in .ai/handoff/STATUS.md and open
# with the maintainer, together with the same question about who merges a
# scanner bump. SECURITY.md records the same class of gap on the release path.

name: AAHP Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: >-
          Layer 2 base commit (full 40-character SHA). Required: at --level ci
          the content-drift gate fails closed without an explicit base, and a
          manual run carries no event base to fall back on.
        required: true
        type: string

jobs:
  aahp-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Dependabot exemption (handoff gate not applicable)
        if: ${{ github.actor == 'dependabot[bot]' || github.event.head_commit.author.username == 'dependabot[bot]' }}
        run: |
          echo "Dependabot change detected: the AAHP handoff gate does not apply."
          echo "A pure dependency bump introduces no handoff-state change."
          echo "Build stays gated by the CI workflow and the supply chain by the Scan check."

      - name: Checkout code
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        uses: actions/checkout@v7
        with:
          # Full history so the content-drift gate can diff against the base.
          # The base is an ancestor COMMIT rather than a ref, so under a shallow
          # clone a real comparison degrades into "base not found".
          fetch-depth: 0

      - name: Set up Node.js
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (pinned AAHP CLI)
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        run: npm ci --ignore-scripts

      - name: Run aahp verify (CI level, no escape hatch)
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        env:
          # ONE expression, covering every trigger declared under `on:` above. An
          # event matching none of them yields the empty string, and the guard
          # script turns that into exit 2 rather than into an unbased gate that
          # passes. Keep this list and the `on:` list in step: the test
          # enumerates one against the other, so adding a trigger without adding
          # its base here goes red.
          AAHP_BASE_SHA: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.event_name == 'push' && github.event.before
            || github.event_name == 'workflow_dispatch' && inputs.base
            || '' }}
        run: |
          node scripts/require-layer2-base.mjs
          npx --no-install aahp verify . --level ci --base "$AAHP_BASE_SHA"

      - name: Emit conformance record
        if: ${{ github.actor != 'dependabot[bot]' && github.event.head_commit.author.username != 'dependabot[bot]' }}
        run: npx --no-install aahp doctor . --json

  # `aahp check`, which is the command that evaluates `forbiddenPatterns`.
  #
  # `aahp.config.json` has declared an em-dash ban since this repository was
  # created and nothing has ever run it. The two AAHP steps above are `verify`
  # and `doctor`; neither evaluates forbidden patterns. Measured on `main` at
  # df66e15: 112 occurrences of U+2014 across 35 of 101 tracked files, while
  # CONTRIBUTING.md published the rule and every check stayed green. A config
  # declaring a rule that nothing executes does not prove less than it appears
  # to prove; it proves nothing at all, while making the file it lives in read
  # as evidence.
  #
  # A SEPARATE JOB, not a step in `aahp-verify` above, for two reasons. Every
  # step there carries the Dependabot exemption `if:`, and inheriting it would
  # make this gate conditional on who opened the pull request, when nothing
  # about a denylist depends on that. And a job-level condition is the one-line
  # edit that disables a gate while leaving every visible sign of it in place,
  # which is why tests/security/forbidden-patterns.test.ts refuses one here.
  #
  # It fails the job on a match: `aahp check` exits 1, measured rather than
  # assumed, and nothing on this line swallows that status.
  governance:
    name: governance gates (aahp check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies (pinned AAHP CLI)
        run: npm ci --ignore-scripts
      - name: Run aahp check (evaluates forbiddenPatterns)
        run: npx --no-install aahp check .
