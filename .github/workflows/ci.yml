name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: typecheck + build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build and unit tests
        run: npm test

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Only a PUSHED v-tag publishes. `workflow_dispatch` used to be an OR-branch
    # here, and the Run-workflow dialog accepts any branch, so a manual dispatch
    # published an unreviewed branch tree to the public registry. Asserting the
    # event closes the tag-dropdown variant too. tests/security/publish-guard.test.ts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Bind to the exact commit that triggered this run, not to the moving
          # ref. Without it the tree published can differ from the tree `build`
          # verified, and under a manual dispatch it was the dispatched branch.
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm (OIDC trusted publishing, no token)
        run: npm publish --access public --provenance

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Bind to the exact commit that triggered this run, not to the moving
          # ref. Without it the tree published can differ from the tree `build`
          # verified, and under a manual dispatch it was the dispatched branch.
          ref: ${{ github.sha }}
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "elvatis-mcp $GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME. See the README changelog."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
