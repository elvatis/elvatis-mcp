name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: typecheck + build + test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build and unit tests
        run: npm test

  # A SEPARATE check from `build`, and from the release path it protects.
  #
  # `package.json` sat at 1.2.4 from 2026-03-31 to 2026-08-21 while `main` took
  # 35 commits, two of them security fixes. Both were correct, both were merged,
  # and neither could ever be installed: npm refuses a duplicate version and the
  # tag already existed, so re-tagging was no way out either. Nothing went red,
  # because nothing asked whether the release path could be walked at all - only
  # whether it was guarded. This job asks the consequence: can the code in this
  # tree reach a user, yes or no.
  #
  # It answers from the public registry, over the network, and it FAILS CLOSED:
  # a refused connection, a timeout, a 5xx, a body that is not JSON and a 200
  # carrying no `versions` map all exit non-zero. An unreachable registry is not
  # a neutral moment; it is exactly when a bad publish slips through.
  #
  # No `if:`, no `continue-on-error`, no `paths:` filter on this workflow, and no
  # `--registry` on the command below. tests/security/version-guard.test.ts
  # asserts each of those, and executes the script itself in both directions.
  version-guard:
    name: version is not already published
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refuse a version the registry has already issued
        run: npm run version-guard

  publish:
    name: Publish to npm
    # `version-guard` as well as `build`, so the gate is load-bearing on the
    # release path rather than advisory beside it. There is no required status
    # check on this repository (SECURITY.md#release-integrity), so `needs:` is
    # the only place a check can be made to actually hold something up.
    needs: [build, version-guard]
    runs-on: ubuntu-latest
    # Only a PUSHED v-tag publishes. `workflow_dispatch` used to be an OR-branch
    # here, and the Run-workflow dialog accepts any branch, so a manual dispatch
    # published an unreviewed branch tree to the public registry. Asserting the
    # event closes the tag-dropdown variant too. tests/security/publish-guard.test.ts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Bind to the exact commit that triggered this run, not to the moving
          # ref. Without it the tree published can differ from the tree `build`
          # verified, and under a manual dispatch it was the dispatched branch.
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: Refuse to publish a version that disagrees with the tag
        # `publish.yml` carried this check from the first release until it was
        # deleted on 2026-06-27 in the move to OIDC trusted publishing, and the
        # move did not bring it across. Without it the tag and the version it
        # ships are free to disagree: tagging `v1.3.0` on a tree whose
        # package.json still reads `1.2.5` republishes 1.2.5 - or fails as
        # already-published - while the GitHub Release announces v1.3.0. The
        # registry, the tag and the release then name three different things.
        # tests/security/publish-guard.test.ts EXECUTES this script.
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json version ($pkg) does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "publishing $pkg from tag $GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build --if-present
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Publish to npm (OIDC trusted publishing, no token)
        run: npm publish --access public --provenance

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Bind to the exact commit that triggered this run, not to the moving
          # ref. Without it the tree published can differ from the tree `build`
          # verified, and under a manual dispatch it was the dispatched branch.
          ref: ${{ github.sha }}
      - name: Create GitHub Release
        # Pointed at CHANGELOG.md. This read "See the README changelog" while the
        # README had no changelog section and no CHANGELOG.md existed, so every
        # release note sent readers to a register that was not there.
        run: gh release create "$GITHUB_REF_NAME" --title "elvatis-mcp $GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME. See CHANGELOG.md for what changed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
