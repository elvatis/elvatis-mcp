name: Secret Scan

# Gitleaks, on everything, always.
#
# WHY THIS EXISTS AT ALL. There are two independent layers that can catch a
# credential committed here, and until this file there were zero of two.
# Measured on 2026-08-22, unchanged from the measurement in issue #71:
#
#   gh api repos/elvatis/elvatis-mcp -q '.security_and_analysis'
#   -> secret_scanning: disabled
#      secret_scanning_push_protection: disabled
#      secret_scanning_non_provider_patterns: disabled
#      secret_scanning_validity_checks: disabled
#      dependabot_security_updates: disabled
#
# Those are repository settings and cannot be changed from inside this tree.
# This workflow is the other layer, the one that CAN live in the repository.
# It does not replace push protection: push protection stops a credential
# before it becomes public, and this runs after the push. On a PUBLIC
# repository that difference is the whole game, so enabling the platform layer
# is still open with the maintainer. See issue #71.
#
# supply-chain-guard.yml is a dependency scanner. It is not a secret scanner and
# has never looked for one.
#
# THIS WORKFLOW HAS NO `paths`, NO `paths-ignore`, AND MUST NEVER GET ONE.
# That is why it is its own file rather than a job inside ci.yml. The precedent
# is elvatis/elvatis-security-platform#647: the scan sat beside jobs carrying a
# paths-ignore for "**/*.md", "docs/**" and ".ai/handoff/**", so a pull request
# whose diff stayed inside those globs started no jobs at all and was not
# scanned. Markdown is not an odd corner of a repository - it is the first place
# a credential gets pasted, as an example, a curl snippet or a copied error.
# This repository keeps session notes under .ai/handoff/, which is exactly that
# shape of file.
#
# This is the one defect class a later commit cannot undo. Once a live
# credential is in the history of a public repository the remedy is a rotation,
# not a revert, and a history rewrite only removes the convenience of finding
# it.

on:
  push:
    branches: [main]
    # Tag pushes too. A push block carrying only a `branches:` filter does not
    # match a tag push AT ALL, which is how the ref that publishes to npm ended
    # up being the one ref no supply-chain gate ever saw (#79). The same trap
    # applies here, so the tag pattern is named explicitly.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # No `branches:` filter, on purpose. A base filter makes a pull request whose
  # base is a topic branch run NOTHING, and GitHub renders that the same way it
  # renders a run that has not started, so a stacked pull request shows the
  # green tick of a superseded commit. See elvatis/atlas#153.
  pull_request:
  workflow_dispatch:

# Supersede an overtaken run for the same ref rather than letting it hold a
# runner slot to the end.
concurrency:
  # Per-ref for pull requests, per-SHA for pushes. Per-SHA on main is
  # deliberate: it makes every main run its own group, so main runs neither
  # cancel each other nor queue behind each other during a burst of merges.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Scoped to pull requests. On main a cancelled run is not free: a check that
  # concluded `cancelled` is not a check that passed, and the release path reads
  # those conclusions.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    name: gitleaks
    # GitHub-hosted, matching every other workflow in this repository. The
    # estate's self-hosted pool is shared and currently at half capacity, and
    # this job is small; putting it there would queue it behind the fleet for no
    # gain.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history. The scan runs in git mode, so it walks every commit's
          # diff rather than the working tree. A shallow clone would silently
          # reduce the whole thing to the tip commit AND STILL PASS, which is
          # the failure mode this repository keeps finding: a gate that cannot
          # fire reads exactly like a gate that found nothing.
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE secret on
      # organization-owned repositories. The upstream CLI is the same scanner
      # with the same rules and is free, so this installs the binary directly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.29.0"
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version

      # Full history on pull requests too, not only the pull request's own diff.
      # A diff-only scan answers "did THIS branch add a credential" and cannot
      # answer "is one already in here", which is the question that matters
      # while this check is new.
      #
      # --redact keeps a matched value out of the run log, so a finding gives a
      # file and a line and not the credential itself. --exit-code 1 is the
      # default and is stated so that it survives someone editing this block.
      - name: Run gitleaks
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1
