name: Supply Chain Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: homeofe/supply-chain-guard@89ad038343dbd1f28f92593bfb85193fa7f823a2  # v5.12.0
        with:
          fail-on: critical
          comment-on-pr: true
