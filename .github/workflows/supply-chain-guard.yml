name: Supply Chain Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: homeofe/supply-chain-guard@04e8f8d2de15b02985a8f9f92f57126898f35764  # v5.6.2
        with:
          fail-on: critical
          comment-on-pr: true
